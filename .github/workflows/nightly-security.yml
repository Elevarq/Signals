name: Nightly Security

# Elevarq Signals #162 — scheduled security-evidence workflow.
# Complements .github/workflows/ci.yml (push/PR-time gates, fast)
# and .github/workflows/release.yml (release-tag evidence). This
# workflow produces the ongoing posture evidence Elevarq Signals needs
# between releases:
#
#   - Full-history Gitleaks scan against the project allowlist
#     (`.gitleaks.toml`). PR-time uses `gitleaks detect --log-opts
#     -1` for speed; this scans the full history so newly-surfaced
#     historical findings get caught quickly instead of waiting for
#     the next release.
#   - Source-level SBOM (syft, SPDX-JSON) over the working tree.
#     Release-tag SBOMs cover the published container images; this
#     captures the source-graph view between releases.
#   - Source-level Grype scan against that SBOM. Orthogonal to
#     Trivy (which already runs in ci.yml) — two scanners reduce
#     the chance that a single tool's vuln-DB lag misses an
#     advisory.
#   - OpenSSF Scorecard, weekly. Elevarq Signals is a public repo,
#     so Scorecard can evaluate the standard ecosystem signals
#     (branch protection, signed releases, dependency review,
#     etc.).
#
# All produced artefacts are uploaded as workflow artefacts and
# as SARIF where the target tab supports it.
#
# Sibling repo nightly evidence
# stays aligned across the train.

on:
  schedule:
    # Weekly, Monday 05:09 UTC — portfolio scheme: all repos run their
    # deep scan Monday early UTC, staggered 6 minutes apart (Analyzer
    # 05:03, Signals 05:09, Workbench 05:15, pgAgroal-Enterprise 05:21)
    # (Sunday ~22:09 America/Los_Angeles) so results are ready before
    # the Pacific Monday-morning cleanup and simultaneous Grype DB
    # pulls don't collide.
    # Daily cadence dropped to conserve Actions minutes.
    - cron: "9 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  # Write permissions are intentionally NOT declared at the workflow
  # level. Scorecard's publish-to-webapp path rejects workflows that
  # declare write perms globally (HTTP 400, "global perm is set to
  # write") — it requires top-level perms to be read-only with
  # writes scoped to the specific jobs that need them. The
  # Scorecard Token-Permissions check enforces the same pattern.
  # Per-job `permissions:` blocks below grant `security-events: write`
  # only to the SARIF-uploading jobs and `id-token: write` only to
  # the Scorecard job. See #190.

jobs:
  full-history-secrets:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # SARIF upload to the Security tab.
      actions: read            # upload-sarif resolves the workflow run.
    env:
      # Opt JavaScript-based actions into the Node 24 runtime ahead
      # of GitHub's 2026-06-02 forced switch. Declared per-job (not
      # workflow-level) because Scorecard's publish_results webapp
      # rejects workflows with any top-level env block. See #194.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history — push/PR gates already cover HEAD; this
          # job exists specifically to catch deeper-history
          # regressions.
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -euo pipefail
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -sSfLo "$tmp/$TARBALL"          "$BASE/$TARBALL"
          curl -sSfLo "$tmp/checksums.txt"     "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$tmp" && grep "  $TARBALL\$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$TARBALL" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks full-history scan (SARIF)
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks-full-history

      - name: Upload SARIF artefact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif

  source-sbom:
    name: Source SBOM (syft)
    runs-on: ubuntu-24.04
    env:
      # See full-history-secrets job for rationale (Scorecard webapp
      # rejects top-level env, so declared per-job).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Generate source SBOM (SPDX-JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: signals-source.spdx.json
          upload-artifact: false

      - name: Upload SBOM artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: source-sbom
          path: signals-source.spdx.json

  source-vuln:
    name: Source vuln scan (grype)
    runs-on: ubuntu-24.04
    needs: source-sbom
    permissions:
      contents: read
      security-events: write   # SARIF upload to the Security tab.
      actions: read            # upload-sarif resolves the workflow run.
    env:
      # See full-history-secrets job for rationale (Scorecard webapp
      # rejects top-level env, so declared per-job).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download source SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: source-sbom

      - name: Grype scan against SBOM (SARIF)
        id: grype
        # Scanning the SBOM (rather than re-walking the source)
        # keeps the two jobs consistent: Grype evaluates exactly
        # what syft described.
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          sbom: signals-source.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Normalise SARIF artifact locations
        if: always()
        # SBOM-sourced grype results carry an empty (or missing)
        # physicalLocation.artifactLocation.uri — there is no file
        # path inside an SBOM. The code-scanning upload rejects such
        # results ("locationFromSarifResult: expected artifact
        # location", #256), which only surfaces on the FIRST real
        # finding: empty result sets upload fine. Point empty
        # locations at go.mod, the manifest that pulls the flagged
        # module.
        run: |
          jq '
            .runs[].results[]? |= (
              if ((.locations // []) | length) == 0 then
                .locations = [{"physicalLocation":{"artifactLocation":{"uri":"go.mod"},"region":{"startLine":1}}}]
              else . end
            )
            | .runs[].results[]?.locations[]?.physicalLocation.artifactLocation |= (
                if (.uri // "") == "" then .uri = "go.mod" else . end
              )
          ' "${{ steps.grype.outputs.sarif }}" > grype-normalised.sarif
          mv grype-normalised.sarif "${{ steps.grype.outputs.sarif }}"

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-source

      - name: Upload SARIF artefact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: grype-sarif
          path: ${{ steps.grype.outputs.sarif }}

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    # OpenSSF Scorecard only analyses public repositories — skip while
    # the repo is private (it runs automatically once the repo is public).
    if: ${{ !github.event.repository.private }}
    # Scorecard's published action handles its own publishing /
    # SARIF upload semantics; we run it on the same cadence as the
    # other evidence jobs so all the artefacts land together.
    #
    # IMPORTANT: do NOT add an `env:` block to this job. Scorecard's
    # publish_results webapp rejects with HTTP 400 ("scorecard job
    # contains env vars"). The restriction is stricter than the
    # README implies — see #196/#198 for the empirical confirmation.
    # All actions here are pinned to Node 24-native versions, so no
    # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 env is needed (and none can be
    # added, per the above).
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read            # upload-sarif resolves the workflow run.
      # Needed for the `publish_results: true` path to publish to
      # api.scorecard.dev for the public Scorecard badge.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard

      - name: Upload SARIF artefact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: scorecard-sarif
          path: scorecard.sarif
