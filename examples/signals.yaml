# Elevarq Signals configuration
#
# This file configures the Elevarq Signals collector. All values shown are
# defaults unless noted otherwise.
#
# Environment variables override file values. See README.md for the
# full list of environment variables.

# Environment: dev, lab, or prod
# In prod, TLS is strictly enforced on all PostgreSQL connections.
env: dev

# Collector settings
signals:
  # How often to run collection cycles.
  # Duration string: units ns, us, ms, s, m, h, d (day = 24h), w (week = 168h).
  # Examples: 30s, 5m, 1h, 12h, 1d, 1w. (m is minutes; months/years are not
  # supported — they are calendar-ambiguous.)
  poll_interval: 5m

  # Optional: anchor collection to a wall-clock cron schedule instead of
  # ticking every poll_interval from process start. A standard 5-field cron
  # expression; when set it REPLACES poll_interval and there is no immediate
  # baseline collection at start. Interpreted in schedule_timezone (UTC if
  # unset). schedule_jitter spreads a fleet's fires so they don't all hit the
  # target at the same instant. Leave schedule empty to use poll_interval.
  # schedule: "0 2 * * *"          # daily at 02:00
  # schedule_timezone: "Europe/Amsterdam"
  # schedule_jitter: 5m

  # How many days of data to retain in local storage
  retention_days: 30

  # Log level: debug, info, warn, error
  log_level: info

  # Output logs as JSON (useful for log aggregation)
  log_json: false

  # Maximum number of targets collected in parallel
  max_concurrent_targets: 4

  # Per-target collection timeout
  target_timeout: 60s

  # Per-query execution timeout
  query_timeout: 10s

# PostgreSQL targets to monitor
targets:
  - name: my-database
    host: localhost
    port: 5432
    dbname: postgres
    user: signals
    enabled: true

    # Credential source (choose one):
    password_file: /etc/signals/pg_password
    # password_env: PG_MONITOR_PASSWORD
    # pgpass_file: /etc/signals/.pgpass

    # TLS configuration
    # For production, use verify-full with a CA certificate:
    sslmode: prefer
    # sslrootcert_file: /etc/signals/server-ca.crt

# Local SQLite storage
database:
  path: /data/signals.db
  wal: true

# HTTP API
api:
  listen_addr: "127.0.0.1:8081"
  # read_timeout: 30s
  # write_timeout: 180s
