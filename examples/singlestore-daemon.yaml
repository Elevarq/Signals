# #555: Signals daemon config for a SingleStore target.
#
# The env config path (SIGNALS_TARGET_*) cannot express a non-PostgreSQL engine
# (internal/config/config.go builds the env target with no Engine field), so a
# YAML config is REQUIRED to point the normal Signals daemon at SingleStore.
#
# Ephemeral per-run values are overridden via SIGNALS_* env by
# scripts/singlestore-daemon-cadence.sh:
#   SIGNALS_DB_PATH, SIGNALS_POLL_INTERVAL, SIGNALS_MIN_SNAPSHOT_INTERVAL,
#   SIGNALS_API_TOKEN, SIGNALS_LISTEN_ADDR, and SS_RO_PASSWORD (password_env).
# sslmode=disable (loopback dev image) requires SIGNALS_ALLOW_INSECURE_PG_TLS=true.

env: dev

signals:
  poll_interval: 5m
  min_snapshot_interval: 60s
  retention_days: 7
  log_level: info
  max_concurrent_targets: 1
  target_timeout: 90s
  query_timeout: 20s
  high_sensitivity_collectors_enabled: false

targets:
  - name: ss-dev
    engine: singlestore
    host: 127.0.0.1
    port: 3306
    dbname: signals_fixture
    user: signals_ro
    sslmode: disable
    password_env: SS_RO_PASSWORD
    enabled: true

api:
  listen_addr: 127.0.0.1:8081
  token: overridden-by-SIGNALS_API_TOKEN-env-0000000000

database:
  path: /tmp/overridden-by-SIGNALS_DB_PATH.db
  wal: true
