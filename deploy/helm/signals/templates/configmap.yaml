apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-signals-config
  labels:
    app.kubernetes.io/name: signals
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  signals.yaml: |
    env: {{ .Values.env }}
    signals:
      poll_interval: {{ .Values.collector.pollInterval }}
      retention_days: {{ .Values.collector.retentionDays }}
      max_concurrent_exports: {{ .Values.collector.maxConcurrentExports }}
      audit_retention_days: {{ .Values.collector.auditRetentionDays }}
      target_timeout: {{ .Values.collector.targetTimeout }}
      query_timeout: {{ .Values.collector.queryTimeout }}
    database:
      path: /data/signals.db
      wal: true
    api:
      listen_addr: "0.0.0.0:{{ .Values.api.port }}"
    {{- if or .Values.target.host .Values.targets }}
    targets:
    {{- end }}
    {{- if .Values.target.host }}
    {{- /*
      #114 — single target rendered into the mounted config. The
      collector reads auth_method and the cloud parameters
      (region / azure_client_id / gcp_impersonate_service_account /
      secret_ref) ONLY from this YAML block; the env single-target
      builder does not populate them (internal/config/config.go).
      Optional fields render only when set so the default password
      target stays byte-for-byte minimal.
    */}}
      - name: default
        host: {{ .Values.target.host }}
        port: {{ .Values.target.port }}
        dbname: {{ .Values.target.dbname }}
        user: {{ .Values.target.user }}
        sslmode: {{ .Values.target.sslmode }}
        {{- with .Values.target.sslRootCertFile }}
        sslrootcert_file: {{ . }}
        {{- end }}
        {{- with .Values.target.authMethod }}
        auth_method: {{ . }}
        {{- end }}
        {{- with .Values.target.region }}
        region: {{ . }}
        {{- end }}
        {{- with .Values.target.azureClientId }}
        azure_client_id: {{ . }}
        {{- end }}
        {{- with .Values.target.gcpImpersonateServiceAccount }}
        gcp_impersonate_service_account: {{ . }}
        {{- end }}
        {{- with .Values.target.secretRef }}
        secret_ref: {{ . }}
        {{- end }}
        {{- /*
          #330 — mTLS client-certificate auth. Only PATHS are rendered
          (sslcert / sslkey); the certificate and key CONTENTS never enter
          values or this ConfigMap. Mount the corresponding Kubernetes
          Secret via extraVolumes/extraVolumeMounts so the files land on
          disk, then point these paths at the mount. The schema requires
          cert+key when auth_method is mtls (FC-MTLS-001). The sslkey must
          be unencrypted — encrypted keys are unsupported (#654).
        */}}
        {{- with .Values.target.sslCertFile }}
        sslcert: {{ . }}
        {{- end }}
        {{- with .Values.target.sslKeyFile }}
        sslkey: {{ . }}
        {{- end }}
        {{- /* Password source only for the default (password) method —
               token/secret methods are passwordless (FC005). */}}
        {{- if and (not .Values.target.authMethod) .Values.target.passwordSecretName }}
        password_env: PG_PASSWORD
        {{- end }}
    {{- end }}
    {{- /*
      #347 — additional targets from the .Values.targets list, so one
      install can monitor several databases. Each entry mirrors the
      single `target` field surface; optional fields render only when
      set (INV-HMT-02: paths / references / env-var names only, never
      credential contents). Password auth here is file/env based —
      the chart-managed passwordSecretName -> PG_PASSWORD injection
      stays scoped to the single `target` block (HMT-R006).
    */}}
    {{- range .Values.targets }}
      - name: {{ .name }}
        host: {{ .host }}
        port: {{ .port | default 5432 }}
        dbname: {{ .dbname | default "postgres" }}
        user: {{ .user | default "signals" }}
        sslmode: {{ .sslmode | default "prefer" }}
        {{- with .sslRootCertFile }}
        sslrootcert_file: {{ . }}
        {{- end }}
        {{- with .authMethod }}
        auth_method: {{ . }}
        {{- end }}
        {{- with .region }}
        region: {{ . }}
        {{- end }}
        {{- with .azureClientId }}
        azure_client_id: {{ . }}
        {{- end }}
        {{- with .gcpImpersonateServiceAccount }}
        gcp_impersonate_service_account: {{ . }}
        {{- end }}
        {{- with .secretRef }}
        secret_ref: {{ . }}
        {{- end }}
        {{- with .sslCertFile }}
        sslcert: {{ . }}
        {{- end }}
        {{- with .sslKeyFile }}
        sslkey: {{ . }}
        {{- end }}
        {{- with .passwordFile }}
        password_file: {{ . }}
        {{- end }}
        {{- with .passwordEnv }}
        password_env: {{ . }}
        {{- end }}
    {{- end }}
