{{- range $entry := .Values.extraEnv }}
{{- if has $entry.name (list "SIGNALS_ENV" "SIGNALS_POLL_INTERVAL" "SIGNALS_RETENTION_DAYS" "SIGNALS_TARGET_TIMEOUT" "SIGNALS_QUERY_TIMEOUT" "SIGNALS_LISTEN_ADDR" "PG_PASSWORD" "SIGNALS_API_TOKEN" "SIGNALS_EXPORT_ON_COLLECT" "SIGNALS_EXPORT_DEST" "SIGNALS_EXPORT_S3_REGION" "SIGNALS_EXPORT_S3_KMS_KEY_ID") }}
{{- fail (printf "extraEnv name %q is managed by the chart and cannot be overridden" $entry.name) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-signals
  labels:
    app.kubernetes.io/name: signals
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  # #718 (F12): the collector is a single-writer SQLite store. The old pod MUST
  # stop before the replacement starts — one store owner at a time. The
  # Kubernetes default (RollingUpdate) would surge a second pod that either
  # mounts the same ReadWriteOnce claim (two writers to one SQLite store) or
  # stalls when the volume cannot attach to the new pod's node, and during a
  # schema change the old binary could keep writing a store the new binary just
  # migrated. Recreate enforces stop-before-start (brief downtime by design).
  # Mixed old/new binaries sharing one store are NOT supported.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: signals
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        # #728 (A2): roll the pod when the target ConfigMap content changes so a
        # config-only `helm upgrade` is actually applied. The daemon has no
        # config-file watcher, so without this a changed ConfigMap would leave
        # the old target/connection settings active until a manual reload or
        # rollout — misleading operators about which databases are monitored.
        # The checksum changes iff the rendered ConfigMap changes, so a pure
        # image/other change does NOT needlessly restart. Combined with the
        # Recreate strategy (#718) this is a single-store-safe stop-before-start
        # restart — no surge pod, no migration race.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: signals
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- /* #114: AKS workload identity needs the pod to carry
              azure.workload.identity/use: "true" so the webhook injects
              the projected federated token. */}}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Release.Name }}-signals
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup | default 10001 }}
        fsGroup: {{ .Values.securityContext.fsGroup | default 10001 }}
        fsGroupChangePolicy: {{ .Values.securityContext.fsGroupChangePolicy | default "OnRootMismatch" }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: signals
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: {{ .Values.api.port }}
              name: api
              protocol: TCP
          env:
            - name: SIGNALS_ENV
              value: {{ .Values.env | quote }}
            {{- /* #114: the target (host/port/dbname/user/sslmode AND
                  auth_method + cloud params) is delivered through the
                  mounted signals.yaml `targets:` block, not env — the
                  collector only reads auth_method from YAML. Env target
                  vars are intentionally not set here to avoid a
                  duplicate target. */}}
            - name: SIGNALS_POLL_INTERVAL
              value: {{ .Values.collector.pollInterval | quote }}
            - name: SIGNALS_RETENTION_DAYS
              value: {{ .Values.collector.retentionDays | quote }}
            - name: SIGNALS_TARGET_TIMEOUT
              value: {{ .Values.collector.targetTimeout | quote }}
            - name: SIGNALS_QUERY_TIMEOUT
              value: {{ .Values.collector.queryTimeout | quote }}
            - name: SIGNALS_LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.api.port }}"
            {{- /* #472: scheduled export knobs, set via first-class export.*
                  values (denylisted from extraEnv). export.dest is a local
                  directory OR an s3://bucket/prefix URI for native S3
                  delivery (PutObject only, pod IRSA). */}}
            {{- if .Values.export.onCollect }}
            - name: SIGNALS_EXPORT_ON_COLLECT
              value: "true"
            {{- end }}
            {{- with .Values.export.dest }}
            - name: SIGNALS_EXPORT_DEST
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.export.s3.region }}
            - name: SIGNALS_EXPORT_S3_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.export.s3.kmsKeyId }}
            - name: SIGNALS_EXPORT_S3_KMS_KEY_ID
              value: {{ . | quote }}
            {{- end }}
            {{- /* #114: password source only for the default (password)
                  method. Token/secret methods are passwordless (FC005) —
                  no PG_PASSWORD is injected even if a secret name leaks
                  through values. The configmap renders password_env
                  under the same guard, so the two stay in lockstep. */}}
            {{- if and (not .Values.target.authMethod) .Values.target.passwordSecretName }}
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.target.passwordSecretName }}
                  key: {{ .Values.target.passwordSecretKey }}
            {{- end }}
            {{- /* #136: API bearer token from a managed Secret. When
                  tokenSecretName is set, the binary skips the
                  auto-generate path in cmd/signals/main.go and
                  uses the value from the Secret. The token never
                  lands in a ConfigMap or rendered manifest beyond
                  the Secret reference name. */ -}}
            {{- if .Values.api.tokenSecretName }}
            - name: SIGNALS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.tokenSecretName }}
                  key: {{ .Values.api.tokenSecretKey | default "token" }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/signals
              readOnly: true
            - name: data
              mountPath: /data
            {{- /* #114: operator-supplied mounts, e.g. a CA bundle for
                  sslmode: verify-full (point target.sslRootCertFile at
                  the mount path). */}}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: api
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-signals-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-signals-data
          {{- else }}
          {{- /* #501: EVALUATION-ONLY / NON-DURABLE. emptyDir loses the entire
                 store (signals.db: identity, history, watermarks) on every pod
                 restart/reschedule/upgrade. NOT upgrade-safe — never production.
                 Set persistence.enabled=true (default) for a durable PVC. */}}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
