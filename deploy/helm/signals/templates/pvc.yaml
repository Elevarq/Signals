{{- /*
  #140 — PersistentVolumeClaim for the SQLite snapshot store.

  The deployment volume mount references `<release>-signals-data`
  but there was no PVC template until #140. Without this manifest,
  helm-install on a cluster with no operator-managed PVC failed at
  pod scheduling time. Production-readiness requires the chart
  render a complete deployment without hand-edited manifests.

  Toggleable via `persistence.enabled`. When disabled, the
  deployment falls back to an emptyDir volume (data lost on pod
  restart) — acceptable for evaluation, never for production.
*/}}
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-signals-data
  {{- if .Values.persistence.retain }}
  annotations:
    # R-DUR-11 / #712 (F06): retain the SQLite snapshot store across
    # `helm uninstall`. Without this, the chart-owned PVC is deleted on
    # uninstall and — with a StorageClass whose PV reclaimPolicy is Delete —
    # the underlying volume (instance identity, collection history,
    # watermarks) is destroyed. `keep` leaves the PVC (and its bound PV) in
    # place; a same-name / same-namespace reinstall re-attaches (adopts) it.
    # Opt out with `persistence.retain: false` for a disposable store.
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    app.kubernetes.io/name: signals
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size | default "1Gi" }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
