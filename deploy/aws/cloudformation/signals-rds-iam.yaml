AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Elevarq Signals — passwordless onboarding for Amazon RDS / Aurora PostgreSQL
  (#111). Provisions the collector's IAM identity with a minimal rds-db:connect
  policy scoped to one DB user, and runs the collector on EC2 pre-wired for
  auth_method: aws_rds_iam over verify-full TLS. No secrets are stored — the
  credential is a short-lived RDS IAM token minted from this identity at
  connect time (INV001/INV002). The DB-side grant (GRANT rds_iam / pg_monitor)
  is a one-time SQL step; see ../README.md.

Parameters:
  DbHost:
    Type: String
    Description: RDS/Aurora endpoint hostname.
  DbPort:
    Type: Number
    Default: 5432
  DbName:
    Type: String
    Description: Database name to connect to.
  DbUser:
    Type: String
    Default: signals
    Description: PostgreSQL role granted rds_iam + pg_monitor.
  DbResourceId:
    Type: String
    Description: >-
      RDS instance/cluster DbiResourceId (e.g. db-ABCDEFGH...), NOT the DB
      identifier. Scopes the rds-db:connect policy.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for the collector (must route to the RDS instance).
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security group(s) — must allow egress to the DB on DbPort.
  InstanceType:
    Type: String
    Default: t3.small
  ImageUri:
    Type: String
    Default: ghcr.io/elevarq/signals:1.0.2
    Description: Elevarq Signals container image (pinned tag).
  Env:
    Type: String
    Default: prod
    AllowedValues: [prod, lab, dev]
  PollInterval:
    Type: String
    Default: 5m
  LatestAl2023Ami:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  # #501: the separate, encrypted EBS data volume that holds /data (signals.db).
  # Retained + re-attached across instance replacement so history/identity/
  # watermarks survive an upgrade.
  DataVolumeSize:
    Type: Number
    Default: 10
    Description: Size (GiB) of the durable EBS data volume for /data (signals.db).
  DataDeviceName:
    Type: String
    Default: /dev/sdf
    Description: >-
      Stable block-device name the data volume attaches at (#501, R-DUR-02). On
      Nitro/NVMe instances the kernel exposes it as /dev/nvme?n1; the boot-time
      mount resolves the real device and mounts it at /data.

Resources:
  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      # Session Manager / Run Command access for the operator-gated verify
      # steps — the template provisions no SSH key pair.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: rds-iam-connect
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RDSIAMConnect
                Effect: Allow
                Action: rds-db:connect
                Resource: !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}"

  CollectorInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref CollectorRole

  # IMDSv2 is enforced below via MetadataOptions.HttpTokens=required. Trivy's
  # CloudFormation adapter for AVD-AWS-0028 does not read MetadataOptions (the
  # equivalent Terraform in ../terraform passes the same check), so this is a
  # false positive. Remove when Trivy's CFN adapter reads MetadataOptions.
  # trivy:ignore:AVD-AWS-0028
  CollectorInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAl2023Ami
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: !Ref SecurityGroupIds
      IamInstanceProfile: !Ref CollectorInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            Encrypted: true
            VolumeSize: 20
      Tags:
        - Key: Name
          Value: signals-collector
        - Key: app.kubernetes.io/name
          Value: signals
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker
          systemctl enable --now docker
          # AL2023 ships the SSM agent; ensure it is running so the operator
          # can reach the instance via Session Manager / Run Command (no SSH
          # key pair).
          systemctl enable --now amazon-ssm-agent || true
          mkdir -p /etc/signals
          # --- Durable /data volume (#501, R-DUR-01..R-DUR-04) ---------------
          # /data (signals.db: identity, history, cadence watermarks) is backed
          # by the separate encrypted EBS DataVolume (retained + re-attached
          # across instance replacement), NOT the root disk and NOT a Docker
          # named volume. Mount format-if-empty so a re-attached populated
          # volume keeps its signals.db untouched (R-DUR-03).
          DATA_DEV="${DataDeviceName}"
          if [ ! -b "$DATA_DEV" ]; then
            for d in /dev/nvme*n1; do
              [ -b "$d" ] || continue
              if lsblk -no MOUNTPOINT "$d" | grep -q '^/$'; then continue; fi
              DATA_DEV="$d"
            done
          fi
          mkdir -p /data
          if ! blkid "$DATA_DEV" >/dev/null 2>&1; then
            mkfs.ext4 -F "$DATA_DEV"
          fi
          DATA_UUID="$(blkid -s UUID -o value "$DATA_DEV")"
          grep -q "$DATA_UUID" /etc/fstab || \
            echo "UUID=$DATA_UUID /data ext4 defaults,nofail 0 2" >> /etc/fstab
          mount /data || mount "$DATA_DEV" /data
          # Non-root container user (uid 10001, group 10001) owns /data (R-DUR-04).
          chown 10001:10001 /data
          curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            -o /etc/signals/rds-ca.pem
          cat > /etc/signals/signals.yaml <<'YAML'
          env: ${Env}
          signals:
            poll_interval: ${PollInterval}
          database:
            path: /data/signals.db
            wal: true
          api:
            listen_addr: "127.0.0.1:8081"
          targets:
            - name: ${DbName}-rds
              host: ${DbHost}
              port: ${DbPort}
              dbname: ${DbName}
              user: ${DbUser}
              auth_method: aws_rds_iam
              region: ${AWS::Region}
              sslmode: verify-full
              sslrootcert_file: /etc/signals/rds-ca.pem
          YAML
          # The config carries no secret; make the bind-mounted files
          # world-readable so the non-root container (uid 10001) can read them.
          chmod 0644 /etc/signals/signals.yaml /etc/signals/rds-ca.pem
          # Mint a strong control-plane API token and write it to the same
          # /etc/signals/signals.env the AMI unit uses (#292 parity), so the
          # whole file — this token plus any buyer-added SIGNALS_* — is forwarded
          # to the container by reference via `--env-file`. Root-only (0600): the
          # docker client reads it as root at run time. The token value is NEVER
          # put on the docker command line (it would be visible in the journal /
          # `ps`) — R-AMI-06 / INV-AMI-04.
          umask 077
          printf 'SIGNALS_API_TOKEN=%s\n' "$(openssl rand -hex 32)" > /etc/signals/signals.env
          chmod 0600 /etc/signals/signals.env
          # Keep the operator-readable copy of just the token for the verify step.
          sed -n 's/^SIGNALS_API_TOKEN=//p' /etc/signals/signals.env > /root/signals-api-token
          chmod 0600 /root/signals-api-token
          # ENTRYPOINT is `tini --` with CMD `signals`; the `signals` arg below
          # is required, else the image args replace CMD and tini execs --config.
          # --network host: use the instance ENI directly (R-AMI-07). On
          # jumbo-frame ENIs (MTU 9001, the in-VPC default) a Docker bridge
          # container's TLS handshake to RDS black-holes across the 9001->1500
          # MTU boundary; host networking avoids it. The API binds
          # 127.0.0.1:8081 on the host under host networking (no -p needed).
          # /data is the durable EBS mount prepared above (#501): bind the HOST
          # path, never a Docker named volume (which lives on the root disk).
          docker run -d --name signals --restart=always --network host \
            --env-file /etc/signals/signals.env \
            -v /etc/signals:/etc/signals:ro \
            -v /data:/data \
            ${ImageUri} signals --config /etc/signals/signals.yaml

  # --- Durable data volume (#501) -------------------------------------------
  # A separate, encrypted EBS volume holds /data (signals.db). DeletionPolicy +
  # UpdateReplacePolicy Retain keep it when the instance is deleted or replaced
  # by a stack update, so collection history, instance identity, and cadence
  # watermarks survive an instance/AMI upgrade (INV-DUR-01/02/05, R-DUR-05/06).
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt CollectorInstance.AvailabilityZone
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: signals-data
        - Key: app.kubernetes.io/name
          Value: signals

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: !Ref DataDeviceName
      InstanceId: !Ref CollectorInstance
      VolumeId: !Ref DataVolume

Outputs:
  CollectorRoleArn:
    Description: IAM role the collector runs under.
    Value: !GetAtt CollectorRole.Arn
  RdsConnectResourceArn:
    Description: The rds-db:connect resource ARN scoped to DbUser on this instance.
    Value: !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}"
  InstanceId:
    Description: Collector EC2 instance id.
    Value: !Ref CollectorInstance
