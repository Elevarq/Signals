# AWS EC2 Image Builder (AWSTOE) component: bake the Elevarq Signals collector
# into a golden AMI. Mirrors the deploy/aws/terraform run path (docker-run the
# published image under a systemd unit) so a customer's baked AMI ships the
# collector pre-installed.
#
# SECURITY (R-AMI-01 / INV-AMI-01): this component bakes ONLY docker, the pinned
# image, and the systemd unit. It bakes NO credentials, API token, database
# config, or TLS material. Config (/etc/signals/signals.yaml, CA file) and the
# control-plane token are supplied by the buyer AT LAUNCH (user-data / SSM),
# never at bake time. Base AMI: Amazon Linux 2023.
name: signals-collector
description: >-
  Install the Elevarq Signals read-only PostgreSQL diagnostic collector as a
  docker-run systemd service. Config and credentials are supplied at launch, not
  baked. See specifications/marketplace-ami-image-builder.md.
schemaVersion: 1.0

parameters:
  - SignalsImage:
      type: string
      default: "ghcr.io/elevarq/signals:1.5.1"
      description: >-
        Pinned Signals image reference to pre-pull into the AMI. MUST be a
        specific version tag (no 'latest') so the AMI is reproducible (R-AMI-02).

phases:
  - name: build
    steps:
      - name: InstallDocker
        action: ExecuteBash
        inputs:
          commands:
            - set -euo pipefail
            - dnf install -y docker
            - systemctl enable docker

      - name: PrePullImage
        action: ExecuteBash
        inputs:
          commands:
            - set -euo pipefail
            - systemctl start docker
            - docker pull "{{ SignalsImage }}"

      - name: CreateConfigDir
        action: ExecuteBash
        inputs:
          commands:
            # Launch-time mount point for buyer-supplied config. Left EMPTY at
            # bake (no signals.yaml, no CA, no token baked in).
            - set -euo pipefail
            - install -d -m 0755 /etc/signals
            # #501: the /data mount point. The durable EBS data volume is
            # attached at launch (by the buyer's launch template / the
            # terraform/cloudformation that launch this AMI) and mounted here
            # at first boot by signals-data.service below — NOT a root-disk
            # Docker named volume. Baked empty; no data at bake.
            - install -d -m 0755 /data

      # #501 (R-DUR-03/R-DUR-04/R-DUR-07): first-boot preparation of the
      # durable /data volume. Runs at BOOT, not at bake (the EBS volume is only
      # attached at launch). Format-if-empty so a re-attached populated volume
      # keeps its signals.db untouched; chown to the non-root container user
      # (uid 10001, group 10001). The collector unit RequiresMountsFor=/data so
      # it never starts before this mount is in place.
      - name: InstallDataPrepScript
        action: CreateFile
        inputs:
          - path: /usr/local/sbin/signals-prepare-data.sh
            permissions: 0755
            content: |
              #!/bin/bash
              set -euo pipefail
              # Resolve the durable data device: the single non-root block
              # device (NVMe-remapped EBS data volume), preferring the standard
              # attach name when present.
              DATA_DEV="/dev/sdf"
              if [ ! -b "$DATA_DEV" ]; then
                for d in /dev/nvme*n1; do
                  [ -b "$d" ] || continue
                  if lsblk -no MOUNTPOINT "$d" | grep -q '^/$'; then continue; fi
                  DATA_DEV="$d"
                done
              fi
              mkdir -p /data
              # Format ONLY when empty (first provisioning). Re-attach preserves.
              if ! blkid "$DATA_DEV" >/dev/null 2>&1; then
                mkfs.ext4 -F "$DATA_DEV"
              fi
              DATA_UUID="$(blkid -s UUID -o value "$DATA_DEV")"
              grep -q "$DATA_UUID" /etc/fstab || \
                echo "UUID=$DATA_UUID /data ext4 defaults,nofail 0 2" >> /etc/fstab
              mountpoint -q /data || mount /data || mount "$DATA_DEV" /data
              # Non-root container user owns /data (uid 10001, group 10001).
              chown 10001:10001 /data

      - name: InstallDataPrepUnit
        action: CreateFile
        inputs:
          - path: /etc/systemd/system/signals-data.service
            permissions: 0644
            content: |
              [Unit]
              Description=Prepare and mount the Elevarq Signals durable /data volume
              # Run before the collector; the collector RequiresMountsFor=/data.
              Before=signals.service
              DefaultDependencies=no
              After=local-fs.target
              RequiresMountsFor=/

              [Service]
              Type=oneshot
              RemainAfterExit=yes
              ExecStart=/usr/local/sbin/signals-prepare-data.sh

              [Install]
              WantedBy=multi-user.target

      - name: InstallSystemdUnit
        action: CreateFile
        inputs:
          - path: /etc/systemd/system/signals.service
            permissions: 0644
            content: |
              [Unit]
              Description=Elevarq Signals collector
              After=docker.service network-online.target signals-data.service
              Requires=docker.service signals-data.service
              Wants=network-online.target
              # #501: never start the collector before the durable /data volume
              # is mounted, so signals.db is always on the durable disk, never on
              # the ephemeral root disk (R-DUR-07).
              RequiresMountsFor=/data

              [Service]
              Restart=always
              RestartSec=5
              # Buyer supplies /etc/signals/signals.env at launch (root-only)
              # with SIGNALS_API_TOKEN=... and any other SIGNALS_* the collector
              # reads (e.g. SIGNALS_LOG_LEVEL, or the dev-only
              # SIGNALS_ALLOW_INSECURE_PG_TLS). #292: the WHOLE file is
              # forwarded to the container via `--env-file` so every
              # buyer-supplied SIGNALS_* var reaches the collector, not only
              # the token.
              # EnvironmentFile= is kept so systemd fails cleanly if the file is
              # absent. Both are by-reference: neither prints the file or the
              # token to the journal (R-AMI-06). ENTRYPOINT is `tini --`; the
              # `signals` arg is required so image args do not replace CMD.
              EnvironmentFile=/etc/signals/signals.env
              ExecStartPre=-/usr/bin/docker rm -f signals
              # --network host: use the instance ENI directly (R-AMI-07). On
              # jumbo-frame ENIs (MTU 9001, the in-VPC default) a Docker bridge
              # container's TLS handshake to RDS black-holes across the
              # 9001->1500 MTU boundary (TCP connects, then the session hangs);
              # host networking avoids it. The API still binds 127.0.0.1:8081 on
              # the host, so no -p publish is needed.
              # /data is the durable EBS mount prepared by signals-data.service
              # (#501): bind the HOST path, never a Docker named volume (which
              # would live on the ephemeral root disk).
              ExecStart=/usr/bin/docker run --rm --name signals --network host \
                --env-file /etc/signals/signals.env \
                -v /etc/signals:/etc/signals:ro \
                -v /data:/data \
                {{ SignalsImage }} signals --config /etc/signals/signals.yaml
              ExecStop=/usr/bin/docker stop signals

              [Install]
              WantedBy=multi-user.target

      - name: EnableUnit
        action: ExecuteBash
        inputs:
          commands:
            # Enable (start on boot) but do NOT start now: config/token are not
            # present at bake time. The unit starts on first boot once the buyer
            # has provided /etc/signals via user-data / SSM.
            - set -euo pipefail
            - systemctl daemon-reload
            # #501: enable the durable /data prep+mount unit so it runs at first
            # boot before the collector (RequiresMountsFor=/data).
            - systemctl enable signals-data.service
            - systemctl enable signals.service

  - name: validate
    steps:
      - name: DockerInstalledAndEnabled
        action: ExecuteBash
        inputs:
          commands:
            - set -euo pipefail
            - command -v docker >/dev/null
            - systemctl is-enabled docker

      - name: ImagePresent
        action: ExecuteBash
        inputs:
          commands:
            - set -euo pipefail
            - docker image inspect "{{ SignalsImage }}" >/dev/null

      - name: UnitInstalledAndEnabled
        action: ExecuteBash
        inputs:
          commands:
            - set -euo pipefail
            - test -f /etc/systemd/system/signals.service
            - systemctl is-enabled signals.service

      - name: NoBakedSecrets
        action: ExecuteBash
        inputs:
          commands:
            # INV-AMI-01: fail the bake if any credential/config leaked in.
            - set -euo pipefail
            - test ! -e /etc/signals/signals.yaml
            - test ! -e /etc/signals/signals.env
            - test -z "$(ls -A /etc/signals 2>/dev/null)"

  - name: test
    steps:
      - name: UnitEnabledOnBoot
        action: ExecuteBash
        inputs:
          commands:
            - set -euo pipefail
            - systemctl is-enabled signals.service

      - name: ImagePresentForRun
        action: ExecuteBash
        inputs:
          commands:
            # The pinned image the unit runs is present in the AMI.
            - set -euo pipefail
            - docker image inspect "{{ SignalsImage }}" >/dev/null
